# C2 post stat blocks. Abstract placeholder dials — see docs/DESIGN.md §11.
#
# A C2 post does not shoot, sense, or move. Its only effect is that air-defence batteries
# within `coordination_range_m` allocate as one group instead of each independently taking
# whatever is nearest. Remove the post and they revert.
#
# The signature values are deliberately HIGH. A command post concentrates antennas and
# vehicles, which is what makes it findable — and being findable is the point, because it
# is the asset an attacker most wants to kill first.

[ad_command_post]
coordination_range_m = 6000.0
height_m = 4.0
silhouette_width_m = 5.0
[ad_command_post.signature]
optical = 0.85

# A dispersed, harder-to-find post that pays for concealment with reach.
[ad_forward_cp]
coordination_range_m = 3000.0
height_m = 2.5
silhouette_width_m = 3.0
[ad_forward_cp.signature]
optical = 0.45
