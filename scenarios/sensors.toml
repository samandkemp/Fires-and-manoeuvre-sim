# Sensor type stat blocks. Abstract placeholder dials — see docs/DESIGN.md §3.1.
# `modality` selects the propagation channel: `optical` is implemented (LOS + canopy
# transmittance); `acoustic` and `eo_ir` are planned and will add their own terms.

[gen_optical]
modality = "optical"
mount_height_m = 2.0
max_range_m = 4000.0
lambda0_per_s = 0.5
range_half_m = 1200.0
range_exponent = 2.0
# for_width_deg = 360.0   # omit for all-round; instances may set `facing_deg`

[mast_optical]
modality = "optical"
mount_height_m = 12.0
max_range_m = 6000.0
lambda0_per_s = 0.35
range_half_m = 1800.0
range_exponent = 2.0

# Carried by a recce drone (docs/DESIGN.md §9): `mount_height_m` is ignored when a sensor
# is carried — it sees from the airframe's altitude and faces its heading. A downward
# look from altitude means little is masked, so the range falloff is what limits it.
[uas_optical]
modality = "optical"
mount_height_m = 2.0
max_range_m = 3500.0
lambda0_per_s = 0.6
range_half_m = 1000.0
range_exponent = 2.0

# A narrow-arc observer: it can only watch a slice of the map at once, so where it points
# is a real decision. This is the sensor type the §10.3 tasking layer exists for — with
# `[sim] sensor_tasking = true` it re-points itself each epoch toward whichever sector it
# expects to learn the most from. An all-round sensor has nothing to task.
[narrow_optical]
modality = "optical"
mount_height_m = 4.0
max_range_m = 3000.0
lambda0_per_s = 0.6
range_half_m = 1400.0
range_exponent = 2.0
for_width_deg = 70.0

# An air-defence battery's organic radar: long reach, quick to acquire, all-round. This
# is what lets a CIWS self-cue instead of waiting on the net (docs/DESIGN.md §9.5).
[ciws_radar]
modality = "optical"
mount_height_m = 4.0
max_range_m = 5000.0
lambda0_per_s = 1.2
range_half_m = 2500.0
range_exponent = 2.0
