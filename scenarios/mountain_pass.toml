# A composable terrain recipe (docs/DESIGN.md §1.3): the same map described rather than
# picked from a menu. A rolling base, a ridge driven through the middle, woodland on the
# flanks, then a small town in the valley — layers applied in the order written.
#
# The whole point of the map: the ridge splits the battlespace, so whoever holds
# observation over the pass sees the other side move, and everyone else is in defilade.

name = "mountain_pass"
default_seed = 23

[sim]
dt_s = 1.0
epoch_s = 10.0

[terrain]
cell_size_m = 10.0
width_cells = 1000
height_cells = 1000

[terrain.source.layers]
base = { hills = { count = 20, max_height_m = 90.0, base_radius_m = 700.0 } }

# The ridge: running NNE, 320 m at the crest, 1.4 km wide.
[[terrain.source.layers.apply]]
ridge = { bearing_deg = 20.0, crest_m = 320.0, width_m = 1400.0 }

[[terrain.source.layers.apply]]
woodland = { fraction = 0.32, patch_scale_m = 450.0 }

[[terrain.source.layers.apply]]
urban = { blocks = 5, min_size_m = 250.0, max_size_m = 500.0 }

# --- Blue holds the western approach, watching the pass -----------------------------
[[blue.sensors]]
id = "op-1"
type = "mast_optical"
pos = [3200.0, 5400.0]

[[blue.units]]
id = "arty-1"
type = "sp_gun"
pos = [2200.0, 5000.0]

[[blue.units]]
id = "recce-1"
type = "afv"
pos = [3600.0, 5200.0]

# --- Red pushes west through the pass -----------------------------------------------
[[red.units]]
id = "afv-1"
type = "afv"
pos = [7800.0, 5600.0]
route = [[6200.0, 5400.0], [4600.0, 5200.0]]

[[red.units]]
id = "inf-1"
type = "inf_section"
pos = [7600.0, 4800.0]

[[red.sensors]]
id = "red-op-1"
type = "gen_optical"
pos = [7400.0, 5300.0]
