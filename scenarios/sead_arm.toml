# The radar buys its own accuracy (docs/design/12-sead.md §12.3)
#
# One Blue SEAD drone carrying an anti-radiation missile, against one Red gun battery. The
# missile homes on a **transmitting** radar: `cep_m` 15 m against a battery whose radar is
# up, `silent_cep_m` 150 m against one that has shut down. Against a 30 m lethal radius the
# expected damage per round is 0.85 against an emitter and 0.05 against a silent target -
# a near-certain kill, or seventeen rounds to expect one.
#
#   sweep sead_arm --param red.air_defence.0.emitting --values true,false \
#         --seeds 500 --until 240 --metric ad_batteries_killed
#
# Measured, 500 paired seeds:
#
#                       radar up     radar off
#   battery killed        0.980        0.096     (-0.884 +- 0.015, t = -60.5)
#   detections            0.996        0.000
#   drones downed         0.020        0.000
#   AD shots fired        0.020        0.000
#   munitions released    1.14         1.95
#
# The seeker works, and shutting the radar down is a complete answer to it - at the price
# of the entire defence. A battery under EMCON detects **nothing**, so it cues nothing,
# fires nothing and downs nothing. Survive the missile, or see the raid coming; not both.
# That is the trade §12.3 describes, and the numbers now say it because the flag says it.
#
# --- This file previously measured something else -----------------------------------------
#
# `emitting` used to be `self_cue`, one flag doing two jobs. §9.5 defined it as the *cueing
# timeline* - does this battery act on its own radar or wait for a track over the net - and
# §12.3 reused it as the *emission* test. So a "silent" battery counted as dark to the
# missile while its radar carried on detecting perfectly well: 1.000 detections, first
# contact 9.3 s, indistinguishable from the emitting arm. It bought the survivability of
# EMCON without the blindness that is supposed to pay for it, and the row above that reads
# 0.000 detections used to read 1.000.
#
# The flags are separate now (§12.5, gate V69). `emitting` is whether the radar is on;
# `self_cue` is who the battery listens to.
#
# --- What `self_cue` does here, which is nothing ------------------------------------------
#
#   sweep sead_arm --param red.air_defence.0.self_cue --values true,false --seeds 500
#   # +0.000 +- 0.000 - identical on all 500 seeds
#
# Worth keeping rather than deleting, because the reason is the geometry. `sead_uas`
# releases at 2200 m and the `ciws` reaches 2000 m, so the battery gets almost no engagement
# opportunity either way - it fires on 2% of seeds. A dial cannot matter where the thing it
# governs never happens. To make `self_cue` bite, give Red an off-board early-warning radar
# and bring the release range inside the envelope; the cueing timeline then has something to
# be early or late for.
#
# --- Why the geometry is what it is ------------------------------------------------------
#
# That 200 m of standoff is the whole scenario. An earlier cut released at 1500 m - inside
# the envelope - and the drone was shot down before releasing on 99.6% of seeds, so the
# seeker was never tested at all and both arms read 0.00 batteries killed. Release range and
# envelope are a matched pair; sweep `air.sead_uas.release_range_m` through 2000 to price
# the standoff.
#
# One more worth running: sweep `weapons.arm_missile.silent_cep_m` down to 15, where the
# seeker has no homing advantage at all and the munition is an exact identity with an
# ordinary one. That prices the seeker rather than the tactic.

name = "sead_arm"
default_seed = 29

[sim]
dt_s = 1.0
epoch_s = 10.0

[terrain]
cell_size_m = 10.0
width_cells = 700
height_cells = 300

# Flat: an ARM's accuracy is the subject here, and terrain masking would add a second
# reason for a miss.
[terrain.source.flat]
elevation_m = 0.0

# --- Red: one battery, and its radar is the dial ----------------------------------------
#
# `emitting` is the dial. Setting it false shuts the radar down: with no other sensor on
# this side the battery is then blind - and, to the missile, silent.

[[red.air_defence]]
id = "ciws-1"
type = "ciws"
pos = [2000.0, 1500.0]
emitting = true

# Something for the battery to be defending, so the scenario is a raid rather than a duel
# with a lone emplacement.
[[red.units]]
id = "red-hq"
type = "inf_section"
pos = [1600.0, 1500.0]

# --- Blue: the SEAD drone -----------------------------------------------------------
#
# `target` names the battery. A named target resolves across units, batteries and posts
# (docs/design/12-sead.md §12.1), so aiming at air defence needs no special syntax - and
# the aim point exists whether or not the radar is transmitting. What the transmission
# changes is the CEP the missile lands with, which is exactly the V64 statement.

[[blue.air]]
id = "sead-1"
type = "sead_uas"
pos = [6000.0, 1500.0]
altitude_m = 400.0
heading_deg = 180.0
waypoints = [[2000.0, 1500.0]]
target = { unit = "ciws-1" }
