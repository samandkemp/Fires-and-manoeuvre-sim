# What does a fire-direction net actually buy? (docs/design/11-command-and-control.md §11.3)
#
# Three howitzers, three targets, every gun able to range every target. The post covers
# `gun-a` and `gun-b` and leaves `gun-c` 2.2 km out on the flank, so `[sim] fires_need_c2 =
# true` splits Blue into two separate fire-control problems: the netted pair solves the
# side-wide assignment, and `gun-c` falls back to the pre-Phase-10 rule with no idea what
# the others chose.
#
# Sweeping the net's *reach* is the measurement, because it varies how many guns are inside
# one problem without changing anything else:
#
#   sweep fires_c2 --param c2.fires_net.coordination_range_m --values 200,1500,2500 \
#         --set sim.fires_need_c2=true --seeds 500 --until 300 --metric red_cleared_s
#
#   radius   guns netted   red_cleared_s
#     200        0            68.98      (baseline: three independent guns)
#    1500        2            -2.26 +- 1.09  (t = -2.1)
#    2500        3            -2.18 +- 1.08  (t = -2.0)
#
# Coordination is worth about two seconds, and **the third gun adds nothing** — 1500 m and
# 2500 m are within noise of each other. That is the shape to expect rather than a
# disappointment: with three targets for three guns, two netted guns covering two targets
# plus a loose gun taking its nearest already covers the field. The net earns its keep by
# preventing a *duplicate*, and there is only so much duplication available.
#
# The dial itself is correspondingly quiet on this scenario:
#
#   sweep fires_c2 --param sim.fires_need_c2 --values false,true --seeds 500 --until 300
#   # -0.080 +- 0.460 (t = -0.2, 468 of 500 seeds identical) — not significant
#
# --- Why this file reads as a correction ------------------------------------------------
#
# It was built under a hard overkill cap, `max_shooters_per_target`, and measured the
# **opposite**: requiring a net made Blue clear Red 24.5 s *faster* (t = -10.0), and
# widening the net was monotonically worse. Coordination appeared to be a liability.
#
# It was not. The cap was a hard limit that **idled** shooters — a target offered
# `min(elements, cap)` slots, so once targets were scarcer than guns the surplus guns were
# assigned nothing and fired nothing. Indirect fire needs a track, so scarcity is the normal
# state of the opening. And because the cap was applied once per fire-control problem, a
# side split in two got two of them and could put more guns to work than a coordinated side
# was permitted to.
#
# The cap is gone (§11.4, gate V68). §10.2's `(1 - qbar)^k` discount already prices piling
# on; truncating it as well said "rather than overkill, do nothing", which is the wrong
# trade whenever there is nothing else to shoot. With the discount alone the coordinated
# baseline improves from 103.40 s to 66.80 s — that gap is the fire the cap was throwing
# away — and the inversion disappears.
#
# The lesson worth keeping is not about C2 at all: **a dial whose meaning depends on the
# scope it is applied over will invert when that scope changes.** The cap was reasonable
# when a side was one problem and became incoherent the moment a side could be two.
#
# Note the default is `fires_need_c2 = false`, so this file left alone runs with all three
# guns coordinating and the post inert. That is deliberate — the identity is visible in the
# scenario rather than hidden in a default.

name = "fires_c2"
default_seed = 17

[sim]
dt_s = 1.0
epoch_s = 10.0
# One gun per target. Without this cap there is enough fire to cover everything however it
# is allocated, and the net has nothing to prove.
# Left off, so the file runs coordinated by default. Sweep it to see the cost.
fires_need_c2 = false

[terrain]
cell_size_m = 10.0
width_cells = 700
height_cells = 500

# Flat, so nothing masks anything: the only thing varying between arms is who knows what.
[terrain.source.flat]
elevation_m = 0.0

# --- Blue: three guns, an observer, and a net that does not quite reach -----------------

[[blue.units]]
id = "gun-a"
type = "sp_gun"
pos = [800.0, 2200.0]

[[blue.units]]
id = "gun-b"
type = "sp_gun"
pos = [800.0, 2800.0]

# 2.2 km from the post: outside the 1500 m net, and the whole point of the scenario.
[[blue.units]]
id = "gun-c"
type = "sp_gun"
pos = [800.0, 4400.0]

# Indirect fire needs a track (docs/design/02-fires.md). One observer feeds all three guns,
# so what differs between the arms is coordination, not information.
[[blue.sensors]]
id = "obs-1"
type = "mast_optical"
pos = [1000.0, 2500.0]

[[blue.c2]]
id = "blue-fdc"
type = "fires_net"
pos = [800.0, 2500.0]

# --- Red: three targets, spread so that covering all three needs three guns -------------
#
# `afv` carries a 2500 m cannon and Red sits 4 km out, so Red cannot shoot back. Deliberate:
# the question is what Blue *chooses*, and return fire would bury that under attrition.

[[red.units]]
id = "tgt-1"
type = "afv"
pos = [4800.0, 2200.0]

[[red.units]]
id = "tgt-2"
type = "afv"
pos = [4800.0, 2800.0]

[[red.units]]
id = "tgt-3"
type = "afv"
pos = [4800.0, 4400.0]
